name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  package:
    name: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Package installer
        # --publish never: electron-builder auto-publishes when it detects CI;
        # the release step below owns publishing instead
        run: npm run package -- --publish never

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Kamino $tag — merged to main at ${{ github.sha }}"
          }
          gh release upload $tag "$($exe.FullName)" --clobber
