appId: au.com.lkg.kamino
productName: Kamino
directories:
  output: release
files:
  - out/**
  - '!src/**'
  - '!scripts/**'
  - '!electron.vite.config.ts'
  - '!electron-builder.yml'
  - '!README.md'
  - '!fleet-dev.log'
  - '!tsconfig*.json'
# node-pty ships N-API prebuilds that must live on the real filesystem, not inside asar
asarUnpack:
  - '**/node_modules/@lydell/**'
win:
  target: nsis
  icon: build/icon.png
  # skip code signing only — icon/metadata still applied via rcedit
  signExecutable: false
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
# @lydell/node-pty is prebuilt N-API — rebuilding would need a local toolchain and isn't required
npmRebuild: false
